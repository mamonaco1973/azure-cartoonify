<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="650" viewBox="0 0 1620 650" role="img" aria-label="A browser loads the single-page app from the cartoonweb storage static website and signs in through an Entra External ID user flow. It asks cartoonify-func, a Flex Consumption Function App whose five HTTP functions validate the Entra token, for a write-only SAS URL and uploads the photo straight to the media storage account. Submitting writes a job row to Cosmos DB and sends the job to the cartoonify-jobs Service Bus queue. A queue-triggered worker in the same app reads the original, normalizes it, calls OpenAI's gpt-image-1 image edit API with the style prompt, saves the cartoon to media storage and updates the job's status."><defs><marker id="a_e_page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_rows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_send" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_trig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_media" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_stat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs><rect width="1620" height="650" fill="#ffffff"/><path d="M600,95.0 H465" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_page)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">GET page</text><path d="M1020,95.0 H1155" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_auth)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">sign in, ID token</text><path d="M730.0,150 V195.0 H250.0 V235" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_up)"/><text x="264.0" y="185.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">SAS PUT</text><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_api)"/><text x="824.0" y="215.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">Bearer token</text><path d="M1020,295.0 H1155" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_rows)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">job rows</text><path d="M810.0,350 V435" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#a_e_send)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">send</text><path d="M600,495.0 H465" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#a_e_trig)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a6700" stroke="#ffffff" stroke-width="6" paint-order="stroke">trigger</text><path d="M250.0,440 V355" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_media)"/><text x="264.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">original, cartoon</text><path d="M390.0,440 V410.0 H1370.0 V355" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_stat)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">status</text><path d="M250.0,550 V580 H1370.0 V555" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_ai)"/><text x="810.0" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvet